[package]
name = "xodr"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust OpenDRIVE (.xodr) importer: bakes a road network into polylines, a lane graph, and a surface mesh."
repository = "https://github.com/jakeaboganda/xodr"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["opendrive", "xodr", "road", "map", "simulation"]
categories = ["parser-implementations", "science::robotics", "simulation"]
documentation = "https://docs.rs/xodr"
# The tests and benchmarks need the map fixtures in tests/data. Those stay in
# git and out of the published tarball. They are 1.7 MB, consumers never need
# them, and two carry third-party licences (see tests/data/README.md). Tests
# shipped without their data could only fail, so the tests go too. Run them
# from a git checkout. examples/crg_data.sh builds the viewer, which isn't
# in the package either.
exclude = [
    "/.github",
    "/.gitignore",
    "/.pi",
    "/ROADMAP*.md",
    "/benches",
    "/examples/crg_data.sh",
    "/rust-toolchain.toml",
    "/tests",
]

[features]
# Serialize the baked network and its surface mesh, for shipping a map to a
# viewer or another process, or caching an import.
serde = ["dep:serde"]

[dependencies]
opencrg = "0.0.2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.bench]
debug = true

[[bench]]
name = "import"
harness = false

[[bench]]
name = "query"
harness = false

# viewer/ bakes maps for the three.js viewer, natively or as WebAssembly.
# usd/ exports them as OpenUSD stages.
[workspace]
members = ["usd", "viewer"]

[package.metadata.docs.rs]
all-features = true
