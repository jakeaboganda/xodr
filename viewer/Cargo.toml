[package]
name = "xodr-viewer"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Bakes OpenDRIVE maps into the JSON the three.js viewer in web/ draws, natively or in the browser."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "viewer_export"
path = "src/main.rs"

[dependencies]
xodr = { path = "..", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# build.sh runs the wasm-bindgen CLI of this exact version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
