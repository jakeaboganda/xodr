<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xodr OpenUSD viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #12151a; color: #d8dee9; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 14px; align-items: center; padding: 8px 12px; background: #1b1f27e6; border-bottom: 1px solid #2a2f3a; z-index: 1; }
  #bar label { cursor: pointer; }
  #open { padding: 4px 10px; background: #2d4a63; border-radius: 5px; }
  #open input { display: none; }
  #status { color: #7c8595; margin-left: auto; }
  #info { position: fixed; right: 12px; bottom: 12px; min-width: 220px; max-width: 420px; padding: 8px 10px; background: #1b1f27e6; border: 1px solid #2a2f3a; border-radius: 6px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; display: none; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 18px; background: #12151acc; border: 3px dashed #2d4a63; z-index: 2; }
</style>
</head>
<body>
<div id="bar">
  <label id="open">open .usda <input type="file" accept=".usda,.usd,.usdc,.usdz"></label>
  <span id="layers"></span>
  <span id="status">open a stage, or drop one on the page</span>
</div>
<div id="info"></div>
<div id="drop">drop a .usda</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>

<script type="module">
// Draws a stage from xodr_usd with three.js's USDLoader, and reads back
// what the loader drops: each prim's xodr: attributes and doubleSided.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { USDLoader } from 'three/addons/loaders/USDLoader.js';

const LAYERS = ['Roads', 'RoadMarks', 'Objects'];

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(1, 2, 1.5);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1e6);
const controls = new OrbitControls(camera, renderer.domElement);
const highlight = new THREE.MeshStandardMaterial({ color: 0x4fa3ff, side: THREE.DoubleSide });

const status = document.getElementById('status');
const info = document.getElementById('info');
let stage = null;
let prims = new Map();
let hovered = null;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/** Each prim by name: its path, its xodr: attributes and whether it is
 * double-sided. Reads the layout xodr_usd writes; other stages get none. */
function index(text) {
  const prims = new Map();
  const path = [];
  let pending = null;
  for (const line of text.split('\n')) {
    const t = line.trim();
    const def = t.match(/^def \w+ "([^"]+)"/);
    if (def) pending = def[1];
    else if (t === '{' && pending) { path.push(pending); prims.set(pending, { path: '/' + path.join('/'), attrs: [], doubleSided: false }); pending = null; }
    else if (t === '}') path.pop();
    else if (path.length) {
      const prim = prims.get(path[path.length - 1]);
      const attr = t.match(/^custom \w+ xodr:(\w+) = (.*)$/);
      if (attr) prim.attrs.push([attr[1], attr[2].replace(/^"(.*)"$/, '$1')]);
      if (t === 'uniform bool doubleSided = 1') prim.doubleSided = true;
    }
  }
  return prims;
}

async function show(name, load) {
  status.textContent = `loading ${name}…`;
  await new Promise(r => setTimeout(r, 30));
  try {
    const t0 = performance.now();
    const { group, text } = await load();
    if (stage) scene.remove(stage);
    stage = group;
    prims = text ? index(text) : new Map();
    stage.traverse(o => {
      if (o.isMesh && prims.get(o.name)?.doubleSided) {
        o.material = Object.assign(o.material.clone(), { side: THREE.DoubleSide });
      }
    });
    scene.add(stage);
    frame(stage);
    layers();
    let meshes = 0;
    stage.traverse(o => { if (o.isMesh) meshes++; });
    status.textContent = `${name}: ${meshes} meshes, ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  } catch (e) {
    status.textContent = `${name}: ${e.message ?? e}`;
    console.error(e);
  }
}

function frame(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3()).length() || 10;
  const center = box.getCenter(new THREE.Vector3());
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(0.3, 0.6, 0.5).multiplyScalar(size));
  camera.near = size / 1e4;
  camera.far = size * 20;
  camera.updateProjectionMatrix();
  controls.update();
}

function layers() {
  const bar = document.getElementById('layers');
  bar.replaceChildren();
  for (const name of LAYERS) {
    const layer = stage.getObjectByName(name);
    if (!layer) continue;
    const label = document.createElement('label');
    const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: true });
    box.onchange = () => { layer.visible = box.checked; };
    label.append(box, ' ' + name);
    bar.append(label);
  }
}

function fromText(text) {
  return { group: new USDLoader().parse(text), text };
}

function openFile(file) {
  show(file.name, async () => /\.usda?$/i.test(file.name) && !(await isBinary(file))
    ? fromText(await file.text())
    : { group: new USDLoader().parse(await file.arrayBuffer()), text: null });
}

async function isBinary(file) {
  const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  return String.fromCharCode(...head) === 'PXR-USDC';
}

document.querySelector('#open input').onchange = e => e.target.files[0] && openFile(e.target.files[0]);
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.style.display = 'none'; });
addEventListener('drop', e => {
  e.preventDefault();
  drop.style.display = 'none';
  const file = e.dataTransfer.files[0];
  if (file) openFile(file);
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => {
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});

/** The path and attributes of `mesh` and of each prim above it. */
function describe(mesh) {
  const prim = prims.get(mesh.name);
  if (!prim) return mesh.name;
  const lines = [prim.path];
  const names = prim.path.split('/').slice(1);
  for (const name of names) {
    for (const [k, v] of prims.get(name)?.attrs ?? []) lines.push(`${k}: ${v}`);
  }
  return lines.join('\n');
}

function shown(object) {
  for (let o = object; o; o = o.parent) if (!o.visible) return false;
  return true;
}

function pick() {
  if (!stage) return;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(stage, true).find(h => h.object.isMesh && shown(h.object));
  const mesh = hit?.object ?? null;
  if (mesh === hovered) return;
  if (hovered) hovered.material = hovered.userData.material;
  hovered = mesh;
  if (mesh) {
    mesh.userData.material = mesh.material;
    mesh.material = highlight;
    info.textContent = describe(mesh);
    info.style.display = 'block';
  } else {
    info.style.display = 'none';
  }
}

renderer.setAnimationLoop(() => {
  controls.update();
  pick();
  renderer.render(scene, camera);
});

const file = new URLSearchParams(location.search).get('file');
if (file) {
  show(file, async () => {
    const response = await fetch(file);
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return fromText(await response.text());
  });
}
</script>
</body>
</html>
