name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The viewer's baker is also built for the browser.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p xodr-viewer --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      # The timing guardrails in tests/budgets.rs compare an indexed lookup
      # against the scan it replaced. A debug build makes both slow enough
      # that the ratio stops meaning anything.
      - run: cargo test --release --test budgets
      - run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # Build the crate from its own tarball, so a file the package leaves
      # out shows up here rather than at publish time.
      - run: cargo package -p xodr

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the dev toolchain; the MSRV job needs the
      # version declared in Cargo.toml instead, so override the file.
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Tests and benches are left out: criterion, a dev-dependency, needs
      # a newer Rust. Users build the library, and the tools build here too.
      - run: cargo check --workspace --all-features

  # Export every test map and check the stages with OpenUSD itself, alone,
  # under the sample catalogue, and flattened.
  usd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --release -p xodr-usd
      - run: |
          mkdir -p target/usd
          for map in tests/data/*.xodr; do
            target/release/xodr_usd "$map" "target/usd/$(basename "$map" .xodr).usda"
          done
      - run: uv run usd/check.py usd/catalogues/sample.usda target/usd/*.usda

  # Run the scripts that generate the test maps and the sample catalogue
  # with uv, as a contributor would, and check that what they write is what
  # is committed, but for the date some writers stamp in the header.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # A script runs with its own folder first on the import path, so one
      # named like a standard module, such as types.py, breaks the rest.
      - run: |
          uv run --no-project python -c '
          import pathlib, sys
          clash = [p for p in pathlib.Path(".").rglob("*.py") if p.stem in sys.stdlib_module_names and "target" not in p.parts]
          sys.exit(f"named like a standard module: {clash}" if clash else None)'
      # introduced.py reads the ASAM schema, which isn't in the repository.
      - run: |
          for script in tests/data/*.py; do
            [ "$script" = tests/data/introduced.py ] || uv run "$script"
          done
      - run: uv run usd/catalogues/sample.py > usd/catalogues/sample.usda
      - run: git diff --exit-code -I 'date="' -- tests/data usd/catalogues
