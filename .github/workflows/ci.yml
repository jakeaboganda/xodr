name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The viewer's baker is also built for the browser.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p xodr-viewer --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      # The timing guardrails in tests/budgets.rs compare an indexed lookup
      # against the scan it replaced. A debug build makes both slow enough
      # that the ratio stops meaning anything.
      - run: cargo test --release --test budgets
      - run: cargo doc --no-deps --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the dev toolchain; the MSRV job needs the
      # version declared in Cargo.toml instead, so override the file.
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  # Export every test map and check the stages with OpenUSD itself, alone,
  # under the sample catalogue, and flattened.
  usd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install usd-core==26.8
      - run: cargo build --release -p xodr-usd
      - run: |
          mkdir -p target/usd
          for map in tests/data/*.xodr; do
            target/release/xodr_usd "$map" "target/usd/$(basename "$map" .xodr).usda"
          done
      - run: python usd/check.py usd/catalogues/sample.usda target/usd/*.usda
